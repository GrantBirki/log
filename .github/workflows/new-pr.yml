name: New Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

cache-mode: none

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: fence
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'X64'
        uses: openai/fence@c7675fea986c29f1d655753a7a61fd6b4141be8f # pin@v0.13.0

      # Comment on new PR requests with deployment instructions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: comment
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: GrantBirki/comment@937820f3623fd0e300294bcc64ac7577fc0ad4cc # pin@v3.0.3
        continue-on-error: true
        with:
          file: .github/new-pr-comment.md
