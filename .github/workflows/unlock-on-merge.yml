# https://github.com/github/branch-deploy/blob/d3c24bd92505e623615b75ffdfac5ed5259adbdb/docs/unlock-on-merge.md

name: Unlock On Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

cache-mode: none

jobs:
  unlock-on-merge:
    runs-on: ubuntu-latest

    steps:
      - name: fence
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'X64'
        uses: openai/fence@c7675fea986c29f1d655753a7a61fd6b4141be8f # pin@v0.13.0

      - name: unlock on merge
        uses: grantbirki/branch-deploy@7173dcbb72a30da0148076fade87260ddd1b5e28 # pin@v12.4.2
        id: unlock-on-merge
        with:
          unlock_on_merge_mode: "true" # <-- indicates that this is the "Unlock on Merge Mode" workflow
          environment_targets: "github-pages"
